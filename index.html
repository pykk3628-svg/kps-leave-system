<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPS Leave System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      text-align: center;
      padding: 40px;
      background: #1e293b;
      border-radius: 20px;
      width: min(90%, 420px);
    }
    h1 { color: #38bdf8; }
    p { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KPS Leave System</h1>
    <p>ระบบใบลาออนไลน์</p>
    <p>เว็บไซต์พร้อมใช้งานแล้ว 🚀</p>
  </div>
</body>
</html>
